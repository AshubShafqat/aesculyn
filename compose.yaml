services:
  aesculyn:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8780:8780"
    environment:
      AESCULYN_PUBLIC_URL: ${AESCULYN_PUBLIC_URL:-http://127.0.0.1:8780}
    volumes:
      - aesculyn-data:/data
      - ./modelstore:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  aesculyn-data:
